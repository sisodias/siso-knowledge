name: Extract Video Insights

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of videos to process'
        required: false
        default: '10'
      model:
        description: 'Minimax model'
        required: false
        default: 'MiniMax-M2.5-highspeed'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic pyyaml requests

      - name: Extract insights
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python scripts/extract_with_minimax.py \
            --limit ${{ github.event.inputs.limit || 10 }} \
            --model "${{ github.event.inputs.model || 'MiniMax-M2.5-highspeed' }}" \
            --db database/queue.db \
            --sources-dir data/sources \
            --output-dir extracted/by_date

      - name: Commit extracted content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Insight Bot"
          git config user.email "bot@example.com"
          git add extracted/
          git diff --staged --quiet || git commit -m "insights: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
